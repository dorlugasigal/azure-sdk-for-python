experiment:
  name: "multi-framework-agent-comparison"

  tracking_backend:
    type: "none"

  targets:
    - name: "weather_agent_local_maf"        # MAF — from weather_agent_target.py
      type: "custom"
    - name: "weather_agent_openai"       # OpenAI SDK — from openai_agent_target.py
      type: "custom"
    - name: "weather_agent_langchain"    # LangChain — from langchain_agent_target.py
      type: "custom"

  dataset:
    name: "agent_queries"
    type: "jsonl"
    args:
      data_path: "demo/data/agent_eval_data.jsonl"

  evaluators:
    # Quality (text-based)
    - name: "coherence"
      mapping:
        query: "dataset.query"
        response: "model.answer"
    - name: "response_completeness"
      mapping:
        response: "model.answer"
        query: "dataset.query"

    # Agent evaluators (conversation-based)
    - name: "task_adherence"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
    - name: "intent_resolution"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
    - name: "task_completion"
      mapping:
        query: "dataset.query"
        response: "model.output_items"

    # Tool evaluators (need tool_definitions)
    - name: "tool_call_accuracy"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
        tool_definitions: "model.tool_definitions"
    - name: "tool_call_success"
      mapping:
        response: "model.output_items"
        tool_definitions: "model.tool_definitions"
    - name: "tool_selection"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
        tool_definitions: "model.tool_definitions"
    - name: "tool_input_accuracy"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
        tool_definitions: "model.tool_definitions"
    - name: "tool_output_utilization"
      mapping:
        query: "dataset.query"
        response: "model.output_items"
        tool_definitions: "model.tool_definitions"

  connections:
    default:
      azure_endpoint: "https://foundry-evee-ko9z2s7c.cognitiveservices.azure.com/"
      azure_deployment: "gpt-4.1-mini"
      azure_ai_project: "https://foundry-evee-ko9z2s7c.services.ai.azure.com/api/projects/foundry-project-evee-ko9z2s7c"
