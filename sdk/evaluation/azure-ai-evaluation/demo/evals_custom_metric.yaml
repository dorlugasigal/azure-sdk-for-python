experiment:
  name: "custom-metric-demo"

  dataset:
    name: "qa_data"
    type: "jsonl"
    args:
      data_path: "demo/data.jsonl"

  metrics:
    - name: "f1_score"
      mapping:
        response: "dataset.answer"
        ground_truth: "dataset.context"
    - name: "answer_length"
      mapping:
        response: "dataset.answer"
