experiment:
  name: "mixed-eval-demo"

  cloud:
    foundry_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    foundry_project: "${AZURE_AI_PROJECT}"
    default_evaluator_deployment_name: "gpt-4.1-mini"

  dataset:
    name: "qa_data"
    type: "jsonl"
    args:
      data_path: "data/qa_data.jsonl"

  evaluators:
    - name: "f1_score"
      mapping:
        response: "dataset.answer"
        ground_truth: "dataset.ground_truth"
    - name: "relevance"
      mapping:
        query: "dataset.question"
        response: "dataset.answer"

  connections:
    default:
      azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
      azure_deployment: "${AZURE_OPENAI_DEPLOYMENT}"
