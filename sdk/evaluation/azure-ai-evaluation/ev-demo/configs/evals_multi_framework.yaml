experiment:
  name: "multi-framework-agent-comparison"

  targets:
    - name: "weather_agent_local_maf"
      type: "custom"
    - name: "weather_agent_openai"
      type: "custom"
    - name: "weather_agent_langchain"
      type: "custom"

  dataset:
    name: "agent_queries"
    type: "jsonl"
    args:
      data_path: "data/agent_eval_data.jsonl"

  evaluators:
    # Quality (text-based)
    - name: "coherence"
      mapping:
        query: "dataset.query"
        response: "target.response"
    - name: "response_completeness"
      mapping:
        response: "target.response"
        query: "dataset.query"

    # Agent evaluators (conversation-based)
    - name: "task_adherence"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
    - name: "intent_resolution"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
    - name: "task_completion"
      mapping:
        query: "dataset.query"
        response: "target.output_items"

    # Tool evaluators (need tool_definitions)
    - name: "tool_call_accuracy"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
        tool_definitions: "target.tool_definitions"
    - name: "tool_call_success"
      mapping:
        response: "target.output_items"
        tool_definitions: "target.tool_definitions"
    - name: "tool_selection"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
        tool_definitions: "target.tool_definitions"
    - name: "tool_input_accuracy"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
        tool_definitions: "target.tool_definitions"
    - name: "tool_output_utilization"
      mapping:
        query: "dataset.query"
        response: "target.output_items"
        tool_definitions: "target.tool_definitions"

  connections:
    default:
      azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
      azure_deployment: "${AZURE_OPENAI_DEPLOYMENT}"
      azure_ai_project: "${AZURE_AI_PROJECT}"
