experiment:
  name: "context7-remote-agent-evaluation"
  description: "Evaluate Context7 MCP documentation agent hosted on Foundry"

  cloud:
    foundry_endpoint: "${AZURE_OPENAI_ENDPOINT}"
    foundry_project: "${AZURE_AI_PROJECT}"
    default_evaluator_deployment_name: "gpt-4.1-mini"
    app_insight: "${AZURE_APP_INSIGHTS_CONNECTION_STRING}"

  targets:
    - name: "context7-docs-agent"
      type: "azure_ai_agent"
      agent_name: "context7-docs-agent"

  dataset:
    name: "doc_queries"
    type: "jsonl"
    args:
      data_path: "data/context7_eval_data.jsonl"

  evaluators:
    - name: "coherence"
      mapping:
        query: "dataset.query"
        response: "model.response"

    - name: "relevance"
      deployment_name: "gpt-4.1"
      mapping:
        query: "dataset.query"
        response: "model.response"

    - name: "task_adherence"
      mapping:
        query: "dataset.query"
        response: "model.output_items"

    - name: "intent_resolution"
      mapping:
        query: "dataset.query"
        response: "model.output_items"

  connections:
    default:
      azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
      azure_deployment: "gpt-4.1"
      azure_ai_project: "${AZURE_AI_PROJECT}"
