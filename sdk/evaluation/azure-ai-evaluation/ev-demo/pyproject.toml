[project]
name = "ev-demo"
version = "0.1.0"
description = "All-in-one demo project for local-evals"
requires-python = ">=3.10"

dependencies = [
    "azure-ai-evaluation[opentelemetry]",
    "python-dotenv>=1.0.0",
    "agent-framework==1.0.1",
    "azure-ai-projects",
    "openai",
    "langchain-openai",
    "langgraph",
    "langchain-azure-ai",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
azure-ai-evaluation = { path = "..", editable = true }
